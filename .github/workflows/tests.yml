name: testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  headless:
    name: Suíte headless (Godot 4.4)
    runs-on: ubuntu-latest
    # Runs anteriores ficaram em "running" por mais de uma hora sem concluir.
    # Com limite, um travamento vira falha com log parcial — que é o que permite
    # descobrir QUEM trava; sem ele, o job fica pendurado para sempre.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot 4.4 headless
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4-stable_linux.x86_64 godot
          chmod +x godot

      - name: Importar recursos
        run: ./godot --headless --path . --import || true

      - name: Rodar a suíte
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/suite.log || code=$?
          # As annotations são o único resumo de falha visível sem login na
          # página do job: cada linha de falha vira um ::error:: com o teste
          # e a mensagem, legível pela API pública. O grep roda MESMO com a
          # suíte falhando — é exatamente quando ele importa.
          grep -E "FALHOU|\[ERRO\]|FALHAS EM" /tmp/suite.log | sed 's/^/::error::/' || true
          exit ${code:-0}
