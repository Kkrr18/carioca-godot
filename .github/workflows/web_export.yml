name: web-export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    name: Exporta Web e publica no Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar Godot 4.4
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4-stable_linux.x86_64 godot
          chmod +x godot

      - name: Baixar templates de exportação 4.4
        run: |
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          unzip -q templates.tpz -d tpz
          mv tpz/templates/* ~/.local/share/godot/export_templates/4.4.stable/

      - name: Importar recursos
        run: ./godot --headless --path . --import

      - name: Exportar Web
        run: |
          rm -rf build
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html
          ls -lh build/web

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
